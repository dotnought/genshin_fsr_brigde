name: NVIDIA compatibility prerelease

on:
  push:
    branches: [feat/nvidia-compatibility]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvidia-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    if: github.repository == 'dotnought/genshin_fsr_brigde'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v2.4.5-state-test.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import x64 MSVC tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $snapshot = & cmd.exe /c "`"$vcvars`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64 failed' }
          foreach ($line in $snapshot) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_.()]*)=(.*)$') {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value $line -Encoding utf8
            }
          }

      - name: Fetch pinned FidelityFX headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.9.4 https://github.com/optiscaler/OptiScaler.git OptiScaler-src
          if ($LASTEXITCODE -ne 0) { throw 'OptiScaler source checkout failed' }
          git -C OptiScaler-src submodule update --init --depth 1 -- external/FidelityFX-SDK-v2
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX header checkout failed' }

      - name: Fetch official DirectStorage 1.3.0 package runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.directstorage/1.3.0/microsoft.direct3d.directstorage.1.3.0.nupkg'
          $archive = Join-Path $env:RUNNER_TEMP 'directstorage-1.3.0.zip'
          Invoke-WebRequest $base -OutFile $archive
          # 固定从 NuGet 官方 HTTPS 包计算的摘要；该 feed 不提供独立 .sha512 文件。
          $expected = 'WJqDGU6eBWVFI7nKEEAZgtI126qZHIU1gH1bn4Udh3KBQX15oCEPd7RsD2URT4BfShLwS3vbPeigD+IMeN73kQ=='
          $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($archive)))
          if ($actual -ne $expected) { throw 'DirectStorage package SHA512 mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'directstorage-1.3.0'
          Expand-Archive $archive $unpacked
          $dest = 'TextureLoader/third_party/dstorage/bin/x64'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$unpacked/native/bin/x64/dstorage.dll", "$unpacked/native/bin/x64/dstoragecore.dll" $dest
          foreach ($name in @('LICENSE.txt', 'LICENSE-CODE.txt', 'NOTICES.txt')) {
            Copy-Item (Join-Path $unpacked $name) (Join-Path 'TextureLoader/third_party/dstorage' $name)
          }

      - name: Clean-build all four components and run SDK-free regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = Join-Path $env:GITHUB_WORKSPACE 'OptiScaler-src\external\FidelityFX-SDK-v2\Kits\FidelityFX'
          cmake -S Dx11FsrBridge -B build-package-bridge -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFX_SDK_KIT_ROOT="$kit" -DDX11FSRBRIDGE_ENABLE_NGX=OFF -DDX11FSRBRIDGE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Bridge configure failed' }
          cmake --build build-package-bridge --clean-first
          if ($LASTEXITCODE -ne 0) { throw 'Bridge build failed' }
          ctest --test-dir build-package-bridge --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Bridge regression tests failed' }
          $components = @(
            @('AntiPlayerMosaic', 'build-package-antiplayermosaic'),
            @('TextureLoader', 'build-tloader-gdds'),
            @('FufuGraphicsPlugin', 'build-package-fufu-graphics')
          )
          foreach ($pair in $components) {
            cmake -S $pair[0] -B $pair[1] -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -ne 0) { throw "Configure failed: $($pair[0])" }
            cmake --build $pair[1] --clean-first
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($pair[0])" }
          }

      - name: Cache Rust build dependencies
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Installer/app/src-tauri/target
          key: nvidia-installer-${{ runner.os }}-${{ hashFiles('Installer/app/src-tauri/Cargo.lock') }}
          restore-keys: nvidia-installer-${{ runner.os }}-

      - name: Build graphical installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Build-OnlineInstaller.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          New-Item -ItemType Directory -Force release-output | Out-Null
          ./Installer/app/build-app.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Preserve successful Rust build before packaging
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Installer/app/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Assemble release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./Build-OnlineInstaller.ps1 -Configuration Release -GithubOnly -FetchUpstream
          if ($LASTEXITCODE -ne 0) { throw 'Release package build failed' }
          Copy-Item dist\github-release\GenshinFSRBridge_v*.7z release-output

      - name: Verify release binaries and prepare test overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-output, release-output\overlay | Out-Null
          $dlls = @(
            'build-package-bridge\Dx11FsrBridge.dll',
            'build-package-antiplayermosaic\AntiPlayerMosaic.dll',
            'build-tloader-gdds\TextureLoader.dll',
            'build-package-fufu-graphics\FSR-Bridge-Plugin.dll'
          )
          $versions = @($dlls | ForEach-Object { (Get-Item $_).VersionInfo.FileVersion })
          $versions | Write-Host
          if (@($versions | Select-Object -Unique).Count -ne 1 -or $versions[0] -ne '2.4.5.0') { throw 'Component version mismatch' }
          $bridge = 'build-package-bridge\Dx11FsrBridge.dll'
          if ((Get-Item $bridge).Length -lt 500000) { throw 'Bridge DLL unexpectedly small' }
          $entry = Select-String -Path 'build-package-bridge\Dx11FsrBridge.map' -Pattern '\bDllMain\b' | Select-Object -First 1
          $entry | Write-Host
          if (-not $entry -or $entry.Line -notmatch 'Dx11FsrBridge.cpp.obj') { throw 'Wrong DllMain owner' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $bridge))
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains('hook_compatibility per_object=1 system_provider=1 handoff=before_consumer')) { throw 'Compatibility build marker missing' }
          foreach ($key in @('Ffx12AsyncUpscale', 'ReShadeDepthCorrection', 'ReShadeDepthJitterPercent', 'ReShadeDepthEdgeAware')) {
            if (-not [Text.Encoding]::Unicode.GetString($bytes).Contains($key)) { throw "Runtime configuration key missing: $key" }
          }
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains('reshade_depth_active input=')) { throw 'Depth correction build marker missing' }
          git --no-pager diff -- Dx11FsrBridge/Dx11FsrBridge.cpp
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace validation failed' }
          $sourceBytes = [Text.Encoding]::UTF8.GetBytes((Get-Content Dx11FsrBridge\Dx11FsrBridge.cpp -Raw))
          Write-Host "Source CR bytes: $(@($sourceBytes | Where-Object { $_ -eq 13 }).Count)"
          $gameProcesses = @(Get-Process -Name YuanShen,GenshinImpact -ErrorAction SilentlyContinue)
          Write-Host "Game processes on build runner: $($gameProcesses.Count)"
          $manifest = @("Source commit: $env:GITHUB_SHA", 'Configuration: Release; NGX OFF; diagnostics OFF', 'In-game validation: pending')
          foreach ($dll in $dlls) {
            $item = Get-Item $dll
            $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
            $manifest += "$($item.Name) version=$($item.VersionInfo.FileVersion) bytes=$($item.Length) SHA256=$hash"
            Copy-Item $dll release-output\overlay
          }
          $manifest | Set-Content release-output\BUILD-MANIFEST.txt -Encoding utf8
          Copy-Item Dx11FsrBridge\Dx11FsrBridge.package.ini release-output\overlay\Dx11FsrBridge.ini
          Copy-Item Dx11FsrBridge\LICENSE release-output\overlay\LICENSE.txt
          Copy-Item Dx11FsrBridge\third_party\reshade\LICENSE.txt release-output\overlay\ReShade-SDK-LICENSE.txt
          Copy-Item release-output\BUILD-MANIFEST.txt release-output\overlay
          git archive --format=zip --output=release-output\GenshinFSRBridge-2.4.5-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }

      - name: Write testing and rollback instructions
        shell: pwsh
        run: |
          @'
          Bridge compute-state restoration test 2.4.5 for Windows 11 / RTX 4060 Ti

          This prerelease fixes compute-state leakage in the native bridge path. Its depth and motion preparation shaders now share one state snapshot and restore the game's compute shader, class instances, constant buffer 0, shader resource 0 and UAVs 0-1. Original UAV append/consume counters are preserved. Original UAVs are unbound before preparation inputs are bound, preventing input/output alias hazards.

          The reported camera-rotation FPS loss occurs with the bridge alone, with both DLSS and FSR 3.1, and with ReShade effects/depth correction disabled. This state-management defect is confirmed by code review and tested on Windows WARP, but has not been established as the cause of that FPS loss. Genshin/NVIDIA performance and visual results still need user testing. Synchronization fences and upscaler math are unchanged. No new diagnostic probes or configuration keys are introduced.

          EXISTING SETUP: close Genshin, back up payload/Bridge/Dx11FsrBridge.dll, then replace ONLY that DLL with the DLL from GenshinFSRBridge-2.4.5-NVIDIA-overlay.zip. Keep all existing INIs, shaders, presets, third-party DLLs and GIMI. No installer rerun, SDK installation or injection-order change is needed. Keep the ReShade SDK license already included with your bridge package.

          First compare with the same bridge-only configuration that reproduced the drop: OptiScaler removed and ReShade effects off. Use the same render resolution, FPS cap, scene and camera movement. Record stationary FPS and rotating-camera FPS. Then restore your normal OptiScaler/ReShade configuration and check rendering, depth effects and scene transitions. To compare against 2.4.4, close the game and restore the backed-up bridge DLL while retaining the same settings.

          ReShade depth correction from 2.4.4 remains included. It substantially improved characters in user testing, but foliage normals/MXAO still flicker. Launchpad smoothed normals worsened that report and are not a validated workaround. This release does not claim to fix foliage normals. Keep Generic Depth (Ignore List) and the correct scene buffer selected.

          For a fresh setup, use the installer package. With your modified GIMI, keep the bridge launcher's TextureLoader OFF and Ffx12Backend=native. Launch through XXMI with add-on-enabled ReShade64.dll first, Dx11FsrBridge.dll second, OptiScaler.dll third, then your GIMI d3d11.dll, using absolute paths to your actual files. Preserve your GIMI DirectStorage runtimes, Mods and configs. The bridge launcher's TextureLoader is a separate loader.

          After a failure, save Dx11FsrBridge.log, OptiScaler.log/ini and ReShade.log before another launch overwrites them. Include stationary/rotating FPS, render resolution and which DLLs/effects were enabled. To roll back, close Genshin and restore the backed-up bridge DLL and saved XXMI library list.

          The overlay includes project DLLs and a reference INI; existing users should replace only the bridge DLL for this test. BUILD-MANIFEST.txt records source, versions, sizes and hashes. SHA256SUMS.txt verifies the downloads. Matching source and ReShade SDK notice are included.
          '@ | Set-Content release-output\TESTING.txt -Encoding utf8
          Copy-Item release-output\TESTING.txt release-output\overlay
          Compress-Archive -Path release-output\overlay\* -DestinationPath release-output\GenshinFSRBridge-2.4.5-NVIDIA-overlay.zip
          Get-ChildItem release-output -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release-output\SHA256SUMS.txt -Encoding ascii

      - name: Upload build evidence and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NVIDIA-compatibility-test
          path: |
            release-output/*.*
            build-package-bridge/Dx11FsrBridge.map
            build-package-bridge/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Publish NVIDIA test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Bridge compute-state restoration test 2.4.5
          prerelease: true
          make_latest: false
          body_path: release-output/TESTING.txt
          fail_on_unmatched_files: true
          files: |
            release-output/*.7z
            release-output/*.zip
            release-output/BUILD-MANIFEST.txt
            release-output/TESTING.txt
            release-output/SHA256SUMS.txt
